name: Build Zenith Launcher EXE and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 minecraft-launcher-lib requests pyinstaller

      - name: Build EXE
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name ZenithLauncher
          --collect-all minecraft_launcher_lib
          --collect-all PyQt6
          zenith_launcher.py

      - name: Save EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithLauncher-Windows
          path: dist/ZenithLauncher.exe
          if-no-files-found: error

      - name: Publish GitHub Release and attach EXE
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/ZenithLauncher.exe
