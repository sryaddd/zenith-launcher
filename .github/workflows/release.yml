name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 minecraft-launcher-lib requests pyinstaller

      - name: Build exe
        run: pyinstaller --onefile --windowed --name ZenithLauncher zenith_launcher.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenithLauncher.exe
          generate_release_notes: true
