name: Build and publish Zenith Launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 requests minecraft-launcher-lib pyinstaller

      - name: Verify source version
        shell: pwsh
        run: |
          if (-not (Test-Path "zenith_launcher.py")) {
            throw "zenith_launcher.py was not found in the repository root."
          }

          $src = Get-Content "zenith_launcher.py" -Raw

          if ($src -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            throw "APP_VERSION was not found in zenith_launcher.py"
          }

          $sourceVersion = $Matches[1]
          Write-Host "Building source version $sourceVersion"

          if ("${{ github.ref_type }}" -eq "tag") {
            $tagVersion = "${{ github.ref_name }}".TrimStart("v")

            if ($sourceVersion -ne $tagVersion) {
              throw "Version mismatch: source is $sourceVersion but tag is ${{ github.ref_name }}"
            }
          }

      - name: Build Windows EXE
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name ZenithLauncher
          --collect-all PyQt6
          --collect-all minecraft_launcher_lib
          zenith_launcher.py

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ZenithLauncher.exe")) {
            throw "Build failed: dist/ZenithLauncher.exe was not created."
          }

          Get-Item "dist/ZenithLauncher.exe" |
            Select-Object Name, Length, FullName

      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithLauncher-Windows
          path: dist/ZenithLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ZenithLauncher.exe
          generate_release_notes: true
