name: Build Zenith Launcher (Windows EXE)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyQt6 minecraft-launcher-lib requests pyinstaller

      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path 'icon.ico') {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZenithLauncher --icon icon.ico zenith_launcher.py
          } else {
            python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZenithLauncher zenith_launcher.py
          }
          if (!(Test-Path 'dist/ZenithLauncher.exe')) {
            throw 'Build failed: dist/ZenithLauncher.exe was not created.'
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZenithLauncher-Windows-x64
          path: dist/ZenithLauncher.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish EXE to GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Zenith Launcher ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/ZenithLauncher.exe
